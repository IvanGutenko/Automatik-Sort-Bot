name: emoda-sorting
services:
 db:
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
   POSTGRES_USER: sorting
   POSTGRES_DB: sorting
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
   - sorting_pg:/var/lib/postgresql/data
  mem_limit: 256m
  cpus: 0.5
  healthcheck:
   test: [CMD-SHELL, 'pg_isready -U sorting -d sorting']
   interval: 10s
   timeout: 3s
   retries: 10
 app:
  image: emoda-sorting:latest
  build: .
  restart: unless-stopped
  environment:
   SORT_BOT_TOKEN: ${SORT_BOT_TOKEN}
   GEMINI_API_KEY: ${GEMINI_API_KEY}
   ADMIN_IDS: ${ADMIN_IDS}
   DATABASE_URL: ${DATABASE_URL}
  depends_on:
   db:
    condition: service_healthy
  init: true
  read_only: true
  tmpfs: [/tmp:size=64m]
  mem_limit: 384m
  cpus: 0.75
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
   driver: json-file
   options: {max-size: 10m, max-file: '3'}
  healthcheck:
   test: [CMD, python, -m, app.healthcheck]
   interval: 30s
   timeout: 5s
   retries: 3
   start_period: 30s
volumes:
 sorting_pg:
